<!DOCTYPE html>
<html lang="{{ if eq .lang "dutch" }}nl{{ else }}en{{ end }}">
<head>
    <meta charset="UTF-8">
    <title>{{ ConfigValueString "site.name" }} - Identity Management</title>
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png"/>
    <link rel="shortcut icon" href="/static/images/favicon.ico">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/fontawesome.all.min.css">
    <link rel="stylesheet" href="/static/css/sweetalert2.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/fonts.css">
    <link rel="stylesheet" type="text/css" href="/static/css/solcon.css">
    {{ with ConfigValueString "site.css" }}
    <link rel="stylesheet" type="text/css" href="/css/styles">
    {{ end }}
</head>
<body>
    <nav class="navbar navbar-solcon navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="/">
                    {{ with ConfigValueString "site.logo" }}
                        <img id="site-logo" src="/images/logo" alt="{{ ConfigValueString "site.name" }}" style="max-height: 32px;" />
                    {{ else }}
                        <span class="solcon-brand">
                            <i class="fa-solid fa-globe"></i> {{ ConfigValueString "site.name" }}
                        </span>
                    {{ end }}
                </a>
            </div>
        </div>
    </nav>
