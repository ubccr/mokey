#------------------------------------------------------------------------------
# Solcon Configuration for Mokey
# Copy this file to /etc/mokey/mokey.toml and adjust settings
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# Site specific configuration
#------------------------------------------------------------------------------
[site]
# Name of your site
name = "Solcon Identity Management"

# Homepage of your organization
homepage = "https://www.solcon.nl"

# Link to your sites help pages
help_url = "https://www.solcon.nl/service-contact"

# Link to your getting started guide
getting_started_url = ""

# Link to your terms of service
tos_url = "https://www.solcon.nl/algemene-voorwaarden"

# Path to custom favicon.ico file (copy Solcon favicon to /etc/mokey/assets/)
favicon = "/etc/mokey/assets/favicon.ico"

# Path to Solcon logo
# Download logo from Solcon website and save to /etc/mokey/assets/
logo = "/etc/mokey/assets/solcon-logo.png"

# Path to custom css styles file
# Copy solcon.css to /etc/mokey/assets/css/solcon-style.css
css = "/etc/mokey/assets/css/solcon-style.css"

# Path to local template override directory. Override templates with Solcon theme
# Copy all templates from solcon-templates/templates/ to this directory
templates_dir = "/etc/mokey/templates"

# Path to local static assets directory
static_assets_dir = "/etc/mokey/assets"

# User account for the mokey service
ktuser = "mokeyapp"

# Path to keytab file
keytab = "/etc/mokey/private/mokeyapp.keytab"

# Default language for the site
# Languages supported: English (english), Dutch (dutch)
default_language = "dutch"

# Directory where translations can be placed
translations_dir = "/etc/mokey/translations"

#------------------------------------------------------------------------------
# User account settings
#------------------------------------------------------------------------------
[accounts]
# Default home directory
default_homedir = "/home"

# Default login shell
default_shell = "/bin/bash"

# Minimum password length
min_passwd_len = 8

# Minimum password classes
min_passwd_classes = 2

# Hash algorithm for generating OTP tokens: sha1, sha256, or sha512
otp_hash_algorithm = "sha256"

# Custom issuer name for OTP tokens
otp_issuer = "Solcon"

# Block list of user accounts from logging in
# block_users = ["username1", "username2", "username3"]

# Extract username from email address
username_from_email = false

# Allowed domains
# allowed_domains = {"solcon.nl" = "default"}

# Require Two-Factor authentication on all accounts
require_mfa = false

# Require FreeIPA admin to activate the account
require_admin_verify = false

# Hide invalid username error message
hide_invalid_username_error = false

# Enable or disable user signup link on the login page
enable_user_signup = true

#------------------------------------------------------------------------------
# Email
#------------------------------------------------------------------------------
[email]
# Base URL used for email links
# base_url = "https://your-mokey-server.solcon.local"

# Max lifetime of branca tokens used for password resets and account verify
token_max_age = 3600

# Secret key for branca tokens. Must be 32 bytes. To generate run:
#    openssl rand -hex 32
token_secret = "REPLACE_WITH_SECURE_RANDOM_32_BYTE_HEX_STRING"

# Hostname for smtp server
smtp_host = "smtp.solcon.nl"

# Port for smtp server
smtp_port = 587

# Enable smtp tls
smtp_tls = "on"

# SMTP Authentication Credentials
# smtp_username = "your-email@solcon.nl"
# smtp_password = "your-email-password"

# Email signature to append to end of all emails
signature = ""

# From email address
from = "noreply@solcon.nl"

#------------------------------------------------------------------------------
# Server settings
#------------------------------------------------------------------------------
[server]
# Address and port to listen
listen = "0.0.0.0:8866"

# Times out the session after inactivity (in seconds)
session_idle_timeout = 900

# Path to ssl certificate
ssl_cert = "/etc/ssl/certs/mokey.solcon.nl.crt"

# Path to ssl key
ssl_key = "/etc/ssl/private/mokey.solcon.nl.key"

# Require secure cookies
secure_cookies = true

# CSRF token secret key. Should be a random string
csrf_secret = "REPLACE_WITH_SECURE_RANDOM_STRING"

# Timeouts
read_timeout = 5
write_timeout = 5
idle_timeout = 120

# Rate limiter
rate_limit_expiration = 60
rate_limit_max = 25

# Enable prometheus metrics endpoint
enable_metrics = false

#------------------------------------------------------------------------------
# Storage
#------------------------------------------------------------------------------
[storage]
# Storage driver. Supported drivers: memory, sqlite3, and redis
driver = "sqlite3"

[storage.sqlite3]
# Path to sqlite3 database used for session storage
dbpath = "/var/lib/mokey/mokey.db"

[storage.redis]
# Redis URL
# url = "redis://<user>:<pass>@127.0.0.1:6379/<db>"

#------------------------------------------------------------------------------
# Hydra
#------------------------------------------------------------------------------
[hydra]
# admin_url = "http://127.0.0.1:4445"
# login_timeout = 86400
# fake_tls_termination = true
